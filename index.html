<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harsh World</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#e8f1ff;--dim:#8aa0c4;--sys:#3fd0ff;--sys2:#1b6fff;--shadow:#9b5cff;--gold:#ffc94a;--red:#ff4d6a;--panel:rgba(6,12,30,.78)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070f;color:var(--ink);font-family:Satoshi,system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;display:block}
.px{font-family:Silkscreen,monospace;letter-spacing:.04em}
.win{position:absolute;background:var(--panel);border:1px solid rgba(63,208,255,.5);box-shadow:0 0 24px rgba(27,111,255,.3),inset 0 0 30px rgba(27,111,255,.1);border-radius:4px;backdrop-filter:blur(8px)}
.win .hd{font-family:Silkscreen,monospace;font-size:11px;color:var(--sys);padding:8px 12px;border-bottom:1px solid rgba(63,208,255,.25);display:flex;justify-content:space-between;gap:8px}
.ui{transition:opacity .8s}
body.intro .ui{opacity:0;pointer-events:none}
#hud{top:14px;left:14px;width:300px;padding-bottom:12px}
#hud .body{padding:10px 12px}
.who{display:flex;gap:10px;align-items:center}
.rank{width:54px;height:54px;display:grid;place-items:center;font:700 28px Silkscreen,monospace;color:#fff;background:linear-gradient(160deg,#2a1856,#0c0820);box-shadow:0 0 16px rgba(155,92,255,.6);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.nm{font-weight:900;font-size:17px}.cls{font-size:12px;color:var(--dim)}
.bar{height:8px;background:#0c1a33;border:1px solid #1d3b6b;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sys2),var(--sys));box-shadow:0 0 10px var(--sys)}
.lv{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}
.goal{margin-top:10px;font-size:12px;color:var(--dim);line-height:1.4}.goal b{color:var(--gold)}
#quests{top:14px;right:14px;width:310px;max-height:calc(100vh - 110px);overflow:auto}
.q{padding:9px 12px;border-bottom:1px solid rgba(63,208,255,.12);font-size:13px;line-height:1.35}
.q .t{font-weight:700}.q .m{font-size:11px;color:var(--dim);margin-top:2px}
.q .tag{font:10px Silkscreen,monospace;color:var(--gold)}.q .tag.ai{color:var(--shadow)}
.q.done .t{text-decoration:line-through;color:var(--dim)}
#bar{left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:6px}
button{font:700 12px Satoshi,sans-serif;color:var(--ink);background:#0d1d3d;border:1px solid #2a5da8;padding:8px 12px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--sys);box-shadow:0 0 10px rgba(63,208,255,.4)}
button.pri{background:linear-gradient(180deg,#1b6fff,#1450c0);border-color:#5fb0ff}
button:disabled{opacity:.5;cursor:default}
#map{left:14px;bottom:14px;width:170px;height:170px;border-radius:50%;overflow:hidden}
#map canvas{width:100%;height:100%;display:block}
#keys{left:198px;bottom:14px;padding:8px 10px;font-size:11px;color:var(--dim);line-height:1.7}
#keys b{font:10px Silkscreen,monospace;color:var(--ink);border:1px solid #2a5da8;padding:1px 5px;border-radius:2px;margin-right:4px}
#prompt{left:50%;bottom:92px;transform:translateX(-50%);padding:10px 16px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#prompt.on{opacity:1}#prompt b{font:12px Silkscreen,monospace;color:#04101f;background:var(--sys);padding:2px 7px;border-radius:2px;margin-right:8px}
#toast{top:84px;left:50%;transform:translateX(-50%);padding:10px 18px;font:12px Silkscreen,monospace;color:var(--sys);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#title{position:fixed;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;transition:opacity 1s;background:radial-gradient(ellipse at center,rgba(20,6,2,0) 30%,rgba(20,6,2,.7) 100%)}
body:not(.intro) #title{opacity:0}
#title h1{font:700 clamp(40px,9vw,120px) Silkscreen,monospace;margin:0;letter-spacing:.08em;color:#fff;text-shadow:0 0 30px rgba(255,120,30,.9),0 0 80px rgba(200,40,20,.7)}
#title p{font:14px Silkscreen,monospace;color:var(--sys);margin-top:18px;animation:blink 1.4s infinite}
#title .s{font:500 16px Satoshi,sans-serif;color:#c9d6f2;margin-top:14px;animation:none;text-shadow:0 2px 12px #000}
@keyframes blink{50%{opacity:.25}}
#modal{inset:0;position:fixed;display:none;place-items:center;background:rgba(3,6,14,.55);z-index:5}
#modal.on{display:grid}
#modal .win{position:relative;width:min(660px,calc(100vw - 32px));max-height:calc(100vh - 60px);overflow:auto}
#modal .in{padding:14px 16px;font-size:14px;line-height:1.5}
#modal h2{margin:0 0 4px;font-size:22px;font-weight:900}
#modal .sub{color:var(--dim);font-size:13px;margin-bottom:12px}
.pips{display:flex;gap:6px;margin:8px 0 12px}
.pip{flex:1;text-align:center;padding:6px 0;font:12px Silkscreen,monospace;border:1px solid #23406d;color:#4b6690}
.pip.on{border-color:var(--sys);color:#fff;background:rgba(63,208,255,.15);box-shadow:0 0 10px rgba(63,208,255,.35)}
.gl{border-left:2px solid #23406d;padding:4px 0 4px 10px;margin:6px 0;font-size:13px}.gl.on{border-color:var(--sys)}
.gl b{font-family:Silkscreen,monospace;font-weight:400;color:var(--sys);margin-right:6px}
.quote{border-left:2px solid var(--gold);padding:6px 10px;margin:10px 0;color:#ffe7b0;font-style:italic}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
.kv span:nth-child(odd){color:var(--dim);font:11px Silkscreen,monospace;padding-top:2px}
.pact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.side{padding:8px 10px;border:1px solid #2b2152;background:rgba(155,92,255,.08);font-size:13px}
.side.h{border-color:#5a4718;background:rgba(255,201,74,.07)}
.side .px{display:block;font-size:10px;margin-bottom:4px;color:var(--shadow)}.side.h .px{color:var(--gold)}
.term{border:1px solid rgba(63,208,255,.2);padding:10px 12px;margin:10px 0;border-radius:3px}.term h4{margin:0 0 4px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
input[type=text]{flex:1;min-width:160px;background:#081329;border:1px solid #23406d;color:var(--ink);padding:8px;font:13px Satoshi,sans-serif;border-radius:3px}
.rec{margin-top:8px;font-size:12px;color:#7dffb2}
.x{background:none;border:none;color:var(--dim);font:12px Silkscreen,monospace;padding:0;cursor:pointer}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
@media (max-width:820px){#quests,#keys{display:none}#hud{width:calc(100vw - 28px)}#map{width:110px;height:110px;bottom:70px}.pact{grid-template-columns:1fr}}
</style>
</head>
<body class="intro">
<canvas id="gl" aria-label="3D world of AI Harsh. Walk Harsh around eight towers, gates and the agents from Agent Wars."></canvas>
<div id="title"><div><h1>HARSH WORLD</h1><div class="s" id="tsub">Loading the island</div><p id="tgo" style="visibility:hidden">PRESS ANY KEY TO ENTER</p></div></div>

<div id="hud" class="win ui"><div class="hd"><span>[ STATUS ]</span><span id="when"></span></div><div class="body">
  <div class="who"><div class="rank" id="rk">?</div><div><div class="nm">AI Harsh</div><div class="cls">Class: Shadow of Harsh</div></div></div>
  <div class="bar"><i id="xp" style="width:0"></i></div>
  <div class="lv"><span id="lvl"></span><span>Next rank: <b id="nx"></b></span></div>

<div id="quests" class="win ui"><div class="hd"><span>[ QUESTS ]</span><span id="qc"></span></div><div id="ql"></div></div>
<div id="map" class="win ui"><canvas id="mm" width="340" height="340"></canvas></div>
<div id="keys" class="win ui"><div><b>W A S D</b>move</div><div><b>SHIFT</b>run <b>SPACE</b>jump</div><div><b>DRAG</b>look <b>SCROLL</b>zoom</div><div><b>E</b>interact</div></div>
<div id="bar" class="win ui">
  <button class="pri" data-open="pact">The Pact</button><button data-open="bosses">Bosses</button>
  <button data-open="dyn">Dynasties</button><button data-open="tutor">The Tutor</button><button data-open="cast">Cast</button>
  <a href="https://github.com/Hvs21/harsh-world" target="_blank" rel="noopener" style="text-decoration:none"><button>Add to it</button></a></div>
<div id="prompt" class="win"></div>
<div id="toast" class="win"></div>
<div id="modal"><div class="win"><div class="hd"><span id="mh">[ SYSTEM ]</span><button class="x" id="mx">CLOSE</button></div><div class="in" id="mb"></div></div></div>
<div id="err"><div><h2>This browser could not start 3D.</h2><p>Try a recent Chrome, Edge, Firefox or Safari.</p></div></div>

  if(a===shadow){const qs=(S.quests&&S.quests.ai)||[];if(qs.length&&towers.length){const q=qs[qi++%qs.length],t=towers.find(t=>t.p.id===q.part)||towers[0];a.tx=t.door.x;a.tz=t.door.z;a.job=q;a.goal=t.p.name;return}}

  const ang=R()*6.283,r=5+R()*13;a.tx=Math.cos(ang)*r;a.tz=Math.sin(ang)*r;return}

function animate(a,dt,t){

 if(a.pet){const hop=mv?Math.abs(Math.sin(a.ph*1.4))*.5:Math.abs(Math.sin(t*2.2))*.12;P.body.position.y=.62+hop;return}

 const idle=Math.sin(t*1.8+a.ph)*.02;P.body.position.y=P.by+(mv?Math.abs(Math.sin(a.ph))*.05:idle);P.head.position.y=P.hy+(mv?Math.abs(Math.sin(a.ph))*.05:idle);
 if(a.work>0){a.work-=dt;P.armL.rotation.x=-2.2+Math.sin(t*9)*.3;P.armR.rotation.x=-2.2+Math.cos(t*9)*.3}
 if(a.y>0){P.armL.rotation.x=P.armR.rotation.x=-2.6;P.legL.rotation.x=.4;P.legR.rotation.x=-.3}

function control(dt){
 const f=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0),s=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);

 for(const D of DYN){mm.fillStyle=D.cols[0];mm.fillRect(c+D.pos[0]*s-20,c+D.pos[1]*s-10,40,20);mm.fillStyle=D.cols[1];mm.fillRect(c+D.pos[0]*s-9,c+D.pos[1]*s-9,18,18)}

function tick(){requestAnimationFrame(tick);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 water.material.uniforms.t.value=t;for(const f of pulse)f(t);for(const p of portals){p.mat.uniforms.t.value=t+p.ph;p.g.position.y=p.y0+Math.sin(t*1.6+p.ph)*.15}
 {const p=flies.geometry.attributes.position;FLY.forEach((f,i)=>p.setXYZ(i,f[0]+Math.sin(t*f[4]+f[3])*2,(f[1]+t*f[4]*1.6)%16,f[2]+Math.cos(t*f[4]*.8+f[3])*2));p.needsUpdate=true}
 if(mode==='play')control(dt);
 for(const a of actors){if(a!==player)think(a,dt);animate(a,dt,t)}
 if(mode==='intro'){const a=t*.12;camera.position.set(Math.sin(a)*165,62+Math.sin(t*.2)*6,Math.cos(a)*165);camT.set(0,4,0);camera.lookAt(camT)}
 else{tgt.set(player.x,player.y+gy(player.x,player.z)+2.6,player.z);camT.lerp(tgt,Math.min(1,dt*8));

   want.set(camT.x+Math.sin(yaw)*Math.cos(pitch)*dd,camT.y+Math.sin(pitch)*dd,camT.z+Math.cos(yaw)*Math.cos(pitch)*dd);
   camera.position.lerp(want,Math.min(1,dt*7));camera.lookAt(camT);
   let best=null,bd=1e9;for(const it of interact){const px=it.actor?it.actor.x:it.pos.x,pz=it.actor?it.actor.z:it.pos.z,d=Math.hypot(px-player.x,pz-player.z);if(d<it.r&&d<bd){bd=d;best=it}}
   if(best!==near){near=best;const el=$('prompt');if(near){el.innerHTML='<b>E</b>'+esc(near.text);el.classList.add('on')}else el.classList.remove('on')}
   minimap()}
 {const fx=mode==='intro'?0:player.x,fz=mode==='intro'?0:player.z;sun.position.set(fx-70,36,fz-48);sun.target.position.set(fx,0,fz)}

  if(!answer){if(!note){inp&&inp.focus();return}answer='My own answer'}b.disabled=true;
  try{const row={id:box.dataset.id,kind:box.dataset.kind,topic:box.dataset.topic||'',answer,note,at:new Date().toISOString()};let r;try{r=await fetch('answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)}).then(r=>r.json())}catch(e){r=null}
    if(!r||!r.ok){const all=JSON.parse(localStorage.getItem('hw-answers')||'{}');all[row.id]=row;try{localStorage.setItem('hw-answers',JSON.stringify(all))}catch(e){}r={ok:true,row}}
    if(!r.ok)throw new Error(r.error||'not saved');ANS[r.row.id]=r.row;toast('RECORDED: '+r.row.id);say(shadow,'Noted. '+r.row.id+' is yours now.',5);
    if(box.dataset.kind==='term')openPact();else quests();
  }catch(err){b.disabled=false;alert('Not saved: '+err.message+'. Your text is still in the box.')}});
function quests(){const h=(S.quests&&S.quests.harsh)||[],ai=(S.quests&&S.quests.ai)||[];
  $('qc').textContent=h.filter(q=>ANS[q.id]).length+' of '+h.length+' yours done';
  $('ql').innerHTML=h.map(q=>`<div class="q ${ANS[q.id]?'done':''}" data-id="${esc(q.id)}" data-kind="quest" data-topic="${esc(q.title)}">
    <div class="tag">YOUR QUEST ${esc(q.id)} · ${esc(q.minutes)} MIN</div><div class="t">${esc(q.title)}</div><div class="m">Reward: ${esc(q.unlocks)}</div>
    ${ANS[q.id]?rec(q.id):`<div class="row"><button class="pri" data-ans="Done">Done</button><button data-ans="Not now">Not now</button></div>`}</div>`).join('')+
    ai.map(q=>`<div class="q"><div class="tag ai">AI HARSH ${esc(q.id)}</div><div class="t">${esc(q.title)}</div><div class="m">Clears when: ${esc(q.proof)}</div></div>`).join('')}
function toast(s){const t=$('toast');t.textContent='[ SYSTEM ] '+s;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3600)}

// ---------- boot
(async()=>{
  try{await Promise.all([document.fonts.load('700 40px Silkscreen'),document.fonts.load('500 30px Satoshi')])}catch(e){}
  const [st,an]=await Promise.all([fetch('state.json').then(r=>r.json()).catch(()=>({})),fetch('answers.jsonl').then(r=>r.text()).catch(()=>'')]);
  S=st||{};try{Object.assign(ANS,JSON.parse(localStorage.getItem('hw-answers')||'{}'))}catch(e){}an.split('\n').filter(Boolean).forEach(l=>{try{const r=JSON.parse(l);ANS[r.id]=r}catch(e){}});
  const lv=S.level||{cleared:0,total:48,rank:'?'};
  $('rk').textContent=lv.rank;$('xp').style.width=(100*lv.cleared/lv.total)+'%';$('lvl').textContent='Level '+lv.cleared+' of '+lv.total;
  $('nx').textContent=RANKS[Math.min(5,RANKS.indexOf(lv.rank)+1)]||'?';$('when').textContent='RUN '+(S.run??'?');
  if(S.target)$('goal').innerHTML='<b>Rank S:</b> '+esc(S.target.what)+'. By '+esc(S.target.by)+'.';
  buildTowers();buildPortals();quests();
  $('tsub').textContent='AI Harsh is rank '+lv.rank+'. Level '+lv.cleared+' of '+lv.total+'.';$('tgo').style.visibility='visible';ready=true;
  window.__w={actors,towers,portals,start,player,keys,cam:()=>({yaw,pitch,dist}),look:(y,p,d)=>{yaw=y;pitch=p;dist=d},DYN};
})();
tick();
</script>
